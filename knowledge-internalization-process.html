<html lang="zh-CN">
<head>
<meta charset="UTF-8">

<title>知识内化为潜意识/长期记忆的脑区动态过程</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #0f0f23; font-family: "PingFang SC","Microsoft YaHei",sans-serif;
    display: flex; flex-direction: column; align-items: center; padding: 20px;
    color: #e0e0e0;
  }
  h1 { font-size: 22px; margin-bottom: 4px; background: linear-gradient(90deg,#ff6b6b,#feca57,#48dbfb,#a29bfe); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
  .subtitle { color: #888; font-size: 13px; margin-bottom: 16px; }
  .main-card {
    max-width: 960px; width: 100%; background: #1a1a2e; border-radius: 16px;
    padding: 24px; box-shadow: 0 8px 40px rgba(0,0,0,0.5);
  }
  svg { width: 100%; height: auto; display: block; }
  .stage-indicator {
    display: flex; justify-content: center; gap: 6px; margin: 16px 0 10px;
  }
  .dot {
    width: 12px; height: 12px; border-radius: 50%;
    background: #2d3436; cursor: pointer; transition: all 0.3s;
    border: 1px solid transparent;
  }
  .dot.active { background: #a29bfe; box-shadow: 0 0 10px #a29bfe; border-color: #fff; }
  .dot.done { background: #55efc4; box-shadow: 0 0 6px #55efc4; }
  .desc-box {
    background: #16213e; border-radius: 10px; padding: 14px 18px;
    min-height: 80px; border-left: 4px solid #a29bfe;
    margin-top: 8px; font-size: 14px; line-height: 1.8;
    transition: border-color 0.5s;
  }
  .desc-box .phase-title { font-weight: bold; font-size: 16px; color: #a29bfe; }
  .desc-box .phase-title.s1 { color: #ff6b6b; }
  .desc-box .phase-title.s2 { color: #feca57; }
  .desc-box .phase-title.s3 { color: #48dbfb; }
  .desc-box .phase-title.s4 { color: #55efc4; }
  .desc-box .phase-title.s5 { color: #fd79a8; }
  .desc-box .phase-title.s6 { color: #a29bfe; }
  .desc-box .highlight { color: #ffd32a; }
  .desc-box .region { color: #74b9ff; font-weight: bold; }
  .controls { display: flex; justify-content: center; gap: 12px; margin: 14px 0 6px; }
  .btn {
    background: #2d3436; color: #e0e0e0; border: none; padding: 8px 22px;
    border-radius: 8px; cursor: pointer; font-size: 14px; transition: all 0.2s;
    font-family: inherit;
  }
  .btn:hover { background: #3d4a56; transform: scale(1.04); }
  .btn:disabled { opacity: 0.3; cursor: not-allowed; transform: none; }
  .btn.primary { background: #6c5ce7; color: #fff; }
  .btn.primary:hover { background: #7d6ff0; }
  .speed-label { color: #888; font-size: 12px; margin-left: 8px; }
  .footer { margin-top: 16px; color: #555; font-size: 11px; }
  .step-label {
    font-size: 12px; fill: #888; text-anchor: middle;
  }
  @keyframes pulse {
    0%,100% { opacity: 1; }
    50% { opacity: 0.4; }
  }
  @keyframes glow {
    0%,100% { filter: drop-shadow(0 0 4px currentColor); }
    50% { filter: drop-shadow(0 0 12px currentColor); }
  }
  .glow { animation: glow 2s ease-in-out infinite; }
  @keyframes moveArrow {
    0% { stroke-dashoffset: 100; }
    100% { stroke-dashoffset: 0; }
  }
  @keyframes fadeInUp {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .fade-in { animation: fadeInUp 0.5s ease; }
</style>
</head>

        <option value="12" selected>中</option>
        <option value="18">慢</option>
      </select>
    </span>
  </div>
</div>

<div class="footer">参考: Consolidation Theory (Squire, 2015) · 系统巩固 (Kamiya & Nadel) · 程序化 (Doyon & Benali) · 睡眠中的 replay (Wilson & McNaughton)</div>

<script>
// ====== 阶段数据 ======
const phases = [
  {
    title: "阶段 ①：感觉输入 → 前额叶皮层",
    cls: "s1",
    detail: `<span class="phase-title s1">📥 感觉输入</span><br>
      外部知识（书本、声音、画面、动作）首先进入对应的 <span class="region">初级感觉皮层</span>：
      <span class="region">枕叶 V1</span>（视觉）、<span class="region">颞叶 A1</span>（听觉）、<span class="region">顶叶 S1</span>（体感）。<br>
      这些信号经 <span class="region">联合皮层</span> 加工后汇聚到 <span class="region">前额叶皮层 (PFC)</span> 的<span class="highlight">工作记忆缓冲区</span>。<br>
      <span style="color:#888;font-size:12px;">🔹 此时信息在大脑中停留仅数秒，容量有限（7±2 个组块）。</span>`
  },
  {
    title: "阶段 ②：工作记忆 · 复述编码",
    cls: "s2",
    detail: `<span class="phase-title s2">🔄 工作记忆中的复述与初步编码</span><br>
      <span class="region">PFC</span> 的 <span class="highlight">背外侧前额叶 (DLPFC)</span> 通过反复激活环路维持信息（<span class="highlight">复述</span>）。<br>
      同时 <span class="region">前扣带回 (ACC)</span> 负责<span class="highlight">冲突检测</span>，决定哪些信息值得深入学习。<br>
      <span class="region">丘脑</span> 作为中继站，调节注意力分配。<br>
      <span style="color:#888;font-size:12px;">🔹 此阶段是"有意识的努力"——反复阅读、背诵、抄写。</span>`
  },
  {
    title: "阶段 ③：海马体编码 · 巩固",
    cls: "s3",
    detail: `<span class="phase-title s3">💾 海马体编码与初始巩固</span><br>
      经过 PFC 筛选的信息被发送至 <span class="region">颞叶内侧 (MTL)</span> 的 <span class="highlight">海马体</span>，
      将分散在各皮层的特征（形状、颜色、含义、情感）<span class="highlight">绑定</span>成一个整体记忆。<br>
      同时 <span class="region">杏仁核</span> 给记忆贴上<span class="highlight">情绪标签</span>——有情绪的记忆更容易被保留。<br>
      <span style="color:#888;font-size:12px;">🔹 睡眠中的慢波振荡 (Slow Wave) 促进海马-皮层间重放 (Replay)。</span>`
  },
  {
    title: "阶段 ④：系统巩固 · 新皮层分布存储",
    cls: "s4",
    detail: `<span class="phase-title s4">🌐 系统巩固 — 从海马到新皮层</span><br>
      睡眠中，<span class="region">海马体</span> 不断将记忆"回放"(Replay) 给 <span class="region">新皮层</span>，
      逐步将记忆<span class="highlight">重新分布</span>到对应的 <span class="region">联合皮层</span>。<br>
      语义知识（概念、事实）存储在 <span class="region">颞叶联合皮层</span>；
      情景记忆碎片散布在 <span class="region">前额叶 + 顶叶 + 颞叶</span>。<br>
      <span style="color:#888;font-size:12px;">🔹 这个过程持续数周至数年，最终记忆不再依赖海马体。</span>`
  },
  {
    title: "阶段 ⑤：程序化 · 基底节接管",
    cls: "s5",
    detail: `<span class="phase-title s5">🎯 程序性记忆 — 基底节自动化</span><br>
      对于<span class="highlight">技能性知识</span>（骑车、打字、弹琴、外语口语），
      经过大量重复后，<span class="region">基底节 (纹状体)</span> 逐步接管控制权。<br>
      <span class="region">小脑</span> 同时优化时序和协调性，使动作<span class="highlight">无需意识监控</span>即可流畅执行。<br>
      <span style="color:#888;font-size:12px;">🔹 此时你不再需要"想每个步骤"——知识变成了肌肉记忆。</span>`
  },
  {
    title: "阶段 ⑥：潜意识提取 · 直觉与自动化",
    cls: "s6",
    detail: `<span class="phase-title s6">⚡ 最终状态 — 潜意识提取 / 直觉</span><br>
      知识被 <span class="region">新皮层</span> 分布式存储，
      被 <span class="region">基底节</span> 程序化，
      最终可在 <span class="highlight">无意识</span> 状态下自动激活：<br>
      · 看到车型 → 不假思索喊出品牌<br>
      · 听到问题 → 脑中直接浮现答案<br>
      这就是 <span class="highlight">"内化"</span>——有意识的"知道"变成了潜意识的"直觉"。<br>
      <span style="color:#888;font-size:12px;">🔹 但潜意识记忆仍然需要定期激活，否则会随时间衰退（遗忘曲线）。</span>`
  }
];

let currentStep = 0;
let playing = false;
let timer = null;

const descEl = document.getElementById('desc');
const dots = document.querySelectorAll('.dot');
const prevBtn = document.getElementById('prevBtn');
const nextBtn = document.getElementById('nextBtn');
const playBtn = document.getElementById('playBtn');
const speedSelect = document.getElementById('speedSelect');

function getSpeed() { return parseInt(speedSelect.value) * 1000; }

function renderStep(step) {
  const p = phases[step];
  descEl.className = 'desc-box fade-in';
  descEl.innerHTML = `<div class="phase-title ${p.cls}">${p.title}</div>${p.detail}`;

  // 高亮箭头
  document.querySelectorAll('.arrow').forEach(a => a.style.opacity = '0');
  document.querySelectorAll('.stage-label').forEach(l => l.style.opacity = '0');
  // 显示对应阶段箭头
  const arrow = document.querySelectorAll(`.arrow`)[step];
  if (arrow) arrow.style.opacity = '1';
  const label = document.querySelectorAll(`.stage-label`)[step];
  if (label) label.style.opacity = '1';

  const svgEls = document.querySelectorAll('#brainSvg [class*="region-"]');
  svgEls.forEach(el => el.style.filter = 'none');
  if (step === 0) document.querySelector('.region-pfc') && (document.querySelector('.region-pfc').style.filter = 'drop-shadow(0 0 8px #ff6b6b)');
  if (step === 1) { document.querySelector('.region-pfc') && (document.querySelector('.region-pfc').style.filter = 'drop-shadow(0 0 8px #feca57)'); }
  if (step === 2) { document.querySelector('.region-mtl') && (document.querySelector('.region-mtl').style.filter = 'drop-shadow(0 0 8px #a29bfe)'); document.querySelector('.region-thalamus') && (document.querySelector('.region-thalamus').style.filter = 'drop-shadow(0 0 6px #74b9ff)'); }
  if (step === 3) { document.querySelector('.region-cortex') && (document.querySelector('.region-cortex').style.filter = 'drop-shadow(0 0 8px #55efc4)'); document.querySelector('.region-mtl') && (document.querySelector('.region-mtl').style.filter = 'drop-shadow(0 0 8px #a29bfe)'); }
  if (step === 4) { document.querySelector('.region-bg') && (document.querySelector('.region-bg').style.filter = 'drop-shadow(0 0 8px #feca57)'); document.querySelector('.region-cerebellum') && (document.querySelector('.region-cerebellum').style.filter = 'drop-shadow(0 0 6px #fd79a8)'); }
  if (step === 5) { document.querySelector('.region-cortex') && (document.querySelector('.region-cortex').style.filter = 'drop-shadow(0 0 8px #55efc4)'); document.querySelector('.region-bg') && (document.querySelector('.region-bg').style.filter = 'drop-shadow(0 0 8px #feca57)'); }

  // 更新 dots
  dots.forEach((d, i) => {
    d.classList.remove('active', 'done');
    if (i === step) d.classList.add('active');
    else if (i < step) d.classList.add('done');
  });

  prevBtn.disabled = step === 0;
  nextBtn.disabled = step === phases.length - 1;
}

// 点击 dot
dots.forEach((d, i) => {
  d.addEventListener('click', () => {
    if (playing) togglePlay();
    currentStep = i;
    renderStep(currentStep);
  });
});

function nextStep() {
  if (currentStep < phases.length - 1) {
    currentStep++;
    renderStep(currentStep);
  } else if (playing) {
    togglePlay();
  }
}

function prevStep() {
  if (currentStep > 0) {
    currentStep--;
    renderStep(currentStep);
  }
}

function togglePlay() {
  playing = !playing;
  playBtn.textContent = playing ? '⏸ 暂停' : '▶ 自动播放';
  if (playing) {
    if (currentStep === phases.length - 1) { currentStep = 0; renderStep(currentStep); }
    timer = setTimeout(function step() {
      if (!playing) return;
      nextStep();
      if (playing && currentStep < phases.length - 1) {
        timer = setTimeout(step, getSpeed());
      } else if (playing && currentStep === phases.length - 1) {
        playing = false;
        playBtn.textContent = '▶ 自动播放';
      }
    }, getSpeed());
  } else {
    clearTimeout(timer);
  }
}

nextBtn.addEventListener('click', () => { if (playing) togglePlay(); nextStep(); });
prevBtn.addEventListener('click', () => { if (playing) togglePlay(); prevStep(); });
playBtn.addEventListener('click', togglePlay);
speedSelect.addEventListener('change', () => { if (playing) { togglePlay(); setTimeout(togglePlay, 100); } });

// 初始渲染
renderStep(0);
</script>
</body>
</html>
